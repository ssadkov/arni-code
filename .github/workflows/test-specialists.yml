name: Test profession helpers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/vs/sessions/skills/spreadsheet-analysis/**'
      - 'src/vs/sessions/skills/presentation-design/**'
      - 'src/vs/sessions/skills/file-organizing/**'
      - 'src/vs/sessions/skills/lesson-design/**'
      - 'scripts/test-specialists.py'
      - '.github/workflows/test-specialists.yml'

permissions:
  contents: read

jobs:
  helpers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 python-pptx==1.0.2
      - run: python scripts/test-specialists.py
