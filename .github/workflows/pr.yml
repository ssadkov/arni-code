name: Arni Code PR

# This fork cannot use Microsoft 1ES self-hosted pools from upstream vscode
# (`1es-vscode-oss-ubuntu-22.04-x64`, etc.). The full Code-OSS compile / unit /
# smoke / Copilot matrix is skipped on purpose.
#
# PRs get a slim signal: install + unit tests + compile for the Arni-specific
# extensions. Windows installer builds remain on workflow_dispatch
# (`.github/workflows/build-windows.yml`).

on:
  pull_request:
    branches:
      - main
      - 'release/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  arni-extensions:
    name: Arni extensions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Test and compile arni-agent
        working-directory: extensions/arni-agent
        run: |
          npm ci
          npm test
          npm run compile

      - name: Test and compile yandex-authentication
        working-directory: extensions/yandex-authentication
        run: |
          npm ci
          npm test
          npm run compile

  upstream-matrix-skipped:
    name: Upstream 1ES matrix skipped
    runs-on: ubuntu-latest
    steps:
      - name: Document skip
        run: |
          echo "Full Code-OSS PR jobs (compile/hygiene, Electron/browser/remote tests, Copilot vitest) still target Microsoft 1ES self-hosted pools and are not run on ssadkov/arni-code."
          echo "Use the Arni extensions job above for fork PR signal. Optional: workflow_dispatch Build Arni Code — Windows x64."
