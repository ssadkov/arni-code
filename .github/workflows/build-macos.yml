name: Build Arni Code — macOS

# Signing and notarization run when the MACOS_CERTIFICATE secret is set:
#   MACOS_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_API_KEY               App Store Connect team API key (.p8 contents)
#   APPLE_API_KEY_ID            public Key ID
#   APPLE_API_ISSUER            public Issuer ID
# Without them the app is only ad-hoc signed: it runs after `xattr -cr`, which
# is fine for internal testing but not for public downloads.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'Source commit to package; empty uses the workflow commit'
        required: false
        default: ''
        type: string
      build_arch:
        description: 'Architecture to build'
        required: false
        default: both
        type: choice
        options: [both, arm64, x64]
      recover_signed_run:
        description: 'Reuse the signed app artifact from this workflow run instead of rebuilding'
        required: false
        default: ''
        type: string
      publish_ready_run:
        description: 'Publish already verified final artifacts from this run; skip rebuilding and signing'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish artifacts to a GitHub Release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Publish a test release without changing stable/latest'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag (e.g. v1.0.0) to attach to. Empty = date-based tag; ignored on tag push'
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: write

jobs:
  build-macos:
    if: inputs.publish_ready_run == ''
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.build_arch == 'arm64' && '[{"arch":"arm64","runner":"macos-15"}]' || inputs.build_arch == 'x64' && '[{"arch":"x64","runner":"macos-15-intel"}]' || '[{"arch":"arm64","runner":"macos-15"},{"arch":"x64","runner":"macos-15-intel"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      VSCODE_ARCH: ${{ matrix.arch }}
      APP_DIR: ${{ github.workspace }}/../ArniCode-darwin-${{ matrix.arch }}
      APP_NAME: Arni Code.app
      PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
      PRERELEASE: ${{ github.event_name != 'push' && inputs.prerelease }}
      SIGNING_ENABLED: ${{ secrets.MACOS_CERTIFICATE != '' }}
      # Postinstall scripts (ripgrep) and gulp download from the GitHub API;
      # anonymous calls from shared macOS runners hit the rate limit (403).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.sha }}

      - name: Validate release credentials
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$SIGNING_ENABLED" = true ]; then
            test -n "$APPLE_API_KEY" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER"
          elif [ "$PUBLISH_RELEASE" = true ]; then
            echo 'Public macOS releases require Developer ID signing and notarization.' >&2
            exit 1
          fi

      - name: Validate macOS signing container before building
        if: env.SIGNING_ENABLED == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing-preflight.keychain"
          P12="$RUNNER_TEMP/signing-preflight.p12"
          trap 'rm -f "$P12"; security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true' EXIT
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application'

      - name: Read .nvmrc
        id: nvmrc
        run: echo "node_version=$(tr -d '\n\r' < .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.node_version }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        if: ${{ !inputs.recover_signed_run }}
        run: npm ci
        env:
          npm_config_fetch_retries: '4'
          npm_config_fetch_retry_mintimeout: '10000'
          npm_config_fetch_retry_maxtimeout: '60000'
          npm_config_arch: ${{ matrix.arch }}

      - name: Test billing client compatibility
        if: ${{ !inputs.recover_signed_run }}
        working-directory: extensions/copilot
        run: npm run test:unit -- src/extension/byok/vscode-node/test/openRouterProvider.spec.ts src/extension/byok/node/test/openAIEndpoint.spec.ts src/extension/prompts/node/panel/test/toolCalling.spec.ts

      - name: Test SDK image and hook completion
        if: ${{ !inputs.recover_signed_run }}
        run: |
          npm run transpile-client
          node scripts/test-sdk-vision-bridge.mjs
          node test/unit/node/index.js --run src/vs/sessions/contrib/chat/test/browser/arniSkillLibrary.test.ts
          node test/unit/node/index.js --run src/vs/sessions/contrib/providers/agentHost/test/browser/agentHostAgents.test.ts

      - name: Test native runtime packaging filters
        if: ${{ !inputs.recover_signed_run }}
        run: |
          node --test build/lib/test/copilot.test.ts
          node --test scripts/test-packaged-copilot-runtime.mjs

      - name: Test media skill with native macOS FFmpeg
        if: ${{ !inputs.recover_signed_run }}
        run: |
          set -euo pipefail
          # The lean ffmpeg formula omits libass; subtitles need the full build.
          brew install ffmpeg-full
          export PATH="$(brew --prefix ffmpeg-full)/bin:$PATH"
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
          python3 src/vs/sessions/skills/media-toolkit/scripts/media.py doctor
          python3 src/vs/sessions/skills/greenscreen-preview/scripts/greenscreen.py doctor
          python3 scripts/test-greenscreen-skill.py
          python3 scripts/test-media-toolkit.py

      - name: Build bundled Arni extensions
        if: ${{ !inputs.recover_signed_run }}
        run: |
          set -e
          for dir in extensions/arni-agent extensions/yandex-authentication extensions/vk-authentication; do
            echo "Building $dir"
            (cd "$dir" && npm install && if [ -f esbuild.js ]; then node esbuild.js --production; fi)
          done

      - name: Build Arni Code (production)
        if: ${{ !inputs.recover_signed_run }}
        run: npm run gulp vscode-darwin-${{ matrix.arch }}-min
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Download signed app for recovery
        if: inputs.recover_signed_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.recover_signed_run }}
          name: ArniCode-signed-pending-notarization-${{ matrix.arch }}
          path: ${{ runner.temp }}/signed-recovery

      - name: Restore and verify signed app
        if: inputs.recover_signed_run != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$APP_DIR"
          ditto -x -k "$RUNNER_TEMP/signed-recovery/notarize.zip" "$APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR/$APP_NAME"
          codesign --display --verbose=4 "$APP_DIR/$APP_NAME" 2>&1 | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"

      - name: Verify bundled billing client
        run: |
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/verify-billing-package.mjs "$APP_DIR/$APP_NAME/Contents/Resources/app" artifacts/macos/build-manifest-${{ matrix.arch }}.json "$VSCODE_ARCH"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_DIR/$APP_NAME/Contents/Info.plist")
          EXPECTED="$VSCODE_ARCH"
          if [ "$EXPECTED" = x64 ]; then EXPECTED=x86_64; fi
          test "$(lipo -archs "$APP_DIR/$APP_NAME/Contents/MacOS/$EXECUTABLE")" = "$EXPECTED"

      - name: Import signing certificate
        if: env.SIGNING_ENABLED == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/buildagent.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$MACOS_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | grep -oE '[0-9A-F]{40}' | head -n 1)
          if [ -z "$IDENTITY" ]; then
            echo "No 'Developer ID Application' identity in the certificate." >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV

      - name: Sign app with hardened runtime
        if: env.SIGNING_ENABLED == 'true' && !inputs.recover_signed_run
        env:
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}
        run: |
          set -e
          SIGNED=false
          for attempt in 1 2 3; do
            if node build/darwin/sign.ts "$(dirname "$GITHUB_WORKSPACE")"; then
              SIGNED=true
              break
            fi
            echo "Signing attempt $attempt failed; retrying after a delay"
            sleep 30
          done
          test "$SIGNED" = true
          codesign --verify --deep --strict --verbose=2 "$APP_DIR/$APP_NAME"

      - name: Ad-hoc sign app (no certificate)
        if: env.SIGNING_ENABLED != 'true'
        run: |
          codesign --force --deep --sign - "$APP_DIR/$APP_NAME"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR/$APP_NAME"

      - name: Archive signed app before notarization
        if: env.SIGNING_ENABLED == 'true'
        run: ditto -c -k --keepParent "$APP_DIR/$APP_NAME" "$RUNNER_TEMP/notarize.zip"

      - name: Preserve signed app for notarization recovery
        if: env.SIGNING_ENABLED == 'true' && !inputs.recover_signed_run
        uses: actions/upload-artifact@v4
        with:
          name: ArniCode-signed-pending-notarization-${{ matrix.arch }}
          path: ${{ runner.temp }}/notarize.zip
          if-no-files-found: error

      - name: Notarize app
        if: env.SIGNING_ENABLED == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -e
          bash scripts/notarize-macos.sh "$RUNNER_TEMP/notarize.zip"
          STAPLED=false
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$APP_DIR/$APP_NAME"; then
              STAPLED=true
              break
            fi
            echo "Ticket retrieval attempt $attempt failed; retrying after a delay"
            sleep 20
          done
          test "$STAPLED" = true
          for action in validate assess; do
            VERIFIED=false
            for attempt in 1 2 3 4 5; do
              if { [ "$action" = validate ] && xcrun stapler validate "$APP_DIR/$APP_NAME"; } || { [ "$action" = assess ] && spctl --assess --type execute --verbose "$APP_DIR/$APP_NAME"; }; then
                VERIFIED=true
                break
              fi
              sleep 20
            done
            test "$VERIFIED" = true
          done

      - name: Verify native CLI
        run: |
          set -euo pipefail
          "$APP_DIR/$APP_NAME/Contents/Resources/app/bin/code" --user-data-dir "$RUNNER_TEMP/billing-cli-profile" --extensions-dir "$RUNNER_TEMP/billing-cli-extensions" --version | tee "$RUNNER_TEMP/cli-version.txt"
          grep -Fx "$(git rev-parse HEAD)" "$RUNNER_TEMP/cli-version.txt"
          grep -Fx "$VSCODE_ARCH" "$RUNNER_TEMP/cli-version.txt"
          cat "$RUNNER_TEMP/cli-version.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare SDK fixture for recovered signed app
        if: inputs.recover_signed_run != ''
        run: |
          npm ci
          npm run transpile-client

      - name: Verify packaged agent startup, tool images and completion
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # Signing changes native Mach-O bytes: publish hashes of the final
          # signed payload rather than the earlier fail-fast inspection.
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/verify-billing-package.mjs "$APP_DIR/$APP_NAME/Contents/Resources/app" "artifacts/macos/build-manifest-$VSCODE_ARCH.json" "$VSCODE_ARCH"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_DIR/$APP_NAME/Contents/Info.plist")
          PACKAGED_CLI="$APP_DIR/$APP_NAME/Contents/Resources/app/node_modules.asar.unpacked/@github/copilot-darwin-$VSCODE_ARCH/index.js"
          # Run with the shipped Electron executable and the shipped CLI/native
          # payload, not the checkout runtime. The model is a local HTTP fixture.
          ELECTRON_RUN_AS_NODE=1 COPILOT_CLI_RUN_AS_NODE=1 "$APP_DIR/$APP_NAME/Contents/MacOS/$EXECUTABLE" \
            "$GITHUB_WORKSPACE/scripts/test-sdk-vision-bridge.mjs" "$PACKAGED_CLI" \
            | tee "artifacts/macos/agent-smoke-$VSCODE_ARCH.txt"
          cat "artifacts/macos/agent-smoke-$VSCODE_ARCH.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Package zip
        id: package_zip
        run: |
          set -e
          mkdir -p artifacts/macos
          ditto -c -k --keepParent "$APP_DIR/$APP_NAME" artifacts/macos/ArniCode-darwin-${{ matrix.arch }}.zip

      - name: Package dmg
        run: |
          set -e
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"
          ditto "$APP_DIR/$APP_NAME" "$STAGE/$APP_NAME"
          ln -s /Applications "$STAGE/Applications"
          DMG="artifacts/macos/ArniCode-darwin-${{ matrix.arch }}.dmg"
          CREATED=false
          for attempt in 1 2 3; do
            if hdiutil create -verbose -fs HFS+ -volname "Arni Code" -srcfolder "$STAGE" -ov -format UDZO "$DMG"; then
              CREATED=true
              break
            fi
            echo "DMG creation attempt $attempt failed"
            sleep 15
          done
          test "$CREATED" = true
          hdiutil verify "$DMG"

      - name: Sign and notarize dmg
        if: env.SIGNING_ENABLED == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -e
          DMG=artifacts/macos/ArniCode-darwin-${{ matrix.arch }}.dmg
          SIGNED=false
          for attempt in 1 2 3 4 5; do
            if codesign --sign "$CODESIGN_IDENTITY" --force --timestamp "$DMG"; then
              SIGNED=true
              break
            fi
            sleep 20
          done
          test "$SIGNED" = true
          bash scripts/notarize-macos.sh "$DMG"
          STAPLED=false
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$DMG"; then
              STAPLED=true
              break
            fi
            sleep 20
          done
          test "$STAPLED" = true
          VERIFIED=false
          for attempt in 1 2 3 4 5; do
            if xcrun stapler validate "$DMG"; then
              VERIFIED=true
              break
            fi
            sleep 20
          done
          test "$VERIFIED" = true

      - name: List artifacts and checksums
        if: always() && steps.package_zip.conclusion == 'success'
        run: |
          : > artifacts/macos/SHA256SUMS-darwin-${{ matrix.arch }}.txt
          for file in artifacts/macos/*.zip artifacts/macos/*.dmg; do
            if [ -f "$file" ]; then shasum -a 256 "$file" >> artifacts/macos/SHA256SUMS-darwin-${{ matrix.arch }}.txt; fi
          done
          ls -lh artifacts/macos
          echo "Commit: $(git rev-parse HEAD); architecture: $VSCODE_ARCH; Developer ID signing: $SIGNING_ENABLED" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/macos/SHA256SUMS-darwin-${{ matrix.arch }}.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Create signed update manifest
        if: env.SIGNING_ENABLED == 'true'
        run: node scripts/create-macos-update.mjs "${{ matrix.arch }}" artifacts/macos

      - name: Upload build artifacts
        if: always() && steps.package_zip.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ArniCode-darwin-${{ matrix.arch }}
          path: artifacts/macos/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$(echo "$INPUT_RELEASE_TAG" | tr -d '[:space:]')" ]; then
            TAG="$(echo "$INPUT_RELEASE_TAG" | tr -d '[:space:]')"
          else
            TAG="v$(date -u +%Y.%m.%d-%H%M)"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          RELEASE_FLAGS=(--latest)
          if [ "$PRERELEASE" = true ]; then RELEASE_FLAGS=(--prerelease --latest=false); fi

          # The Windows build publishes to the same tag, so whichever job comes
          # second uploads into the release the first one created.
          if gh release view "$TAG" > /dev/null 2>&1 \
            || ! gh release create "$TAG" artifacts/macos/* --title "$TAG" --target "$(git rev-parse HEAD)" --generate-notes "${RELEASE_FLAGS[@]}"; then
            gh release upload "$TAG" artifacts/macos/* --clobber
          fi
          echo "Release URL: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Remove signing keychain
        if: always() && env.SIGNING_ENABLED == 'true'
        run: security delete-keychain "$RUNNER_TEMP/buildagent.keychain" || true

  publish-ready:
    if: inputs.publish_ready_run != '' && inputs.publish_release
    name: Publish verified macOS ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.build_arch == 'arm64' && '["arm64"]' || inputs.build_arch == 'x64' && '["x64"]' || '["arm64","x64"]') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.publish_ready_run }}
      SOURCE_COMMIT: ${{ inputs.build_ref }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      VSCODE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Require successful package and Apple checks
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" > source-jobs.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          assert run['path'] == '.github/workflows/build-macos.yml'
          jobs = json.load(open('source-jobs.json'))['jobs']
          matches = [job for job in jobs if job['name'] == 'Build macOS ' + os.environ['VSCODE_ARCH']]
          assert len(matches) == 1 and matches[0]['status'] == 'completed'
          steps = {step['name']: step['conclusion'] for step in matches[0]['steps']}
          required = ['Notarize app', 'Verify native CLI', 'Verify packaged agent startup, tool images and completion', 'Package zip', 'Package dmg', 'Sign and notarize dmg', 'Create signed update manifest', 'Upload build artifacts']
          assert all(steps.get(name) == 'success' for name in required), steps
          assert all(result != 'failure' or name == 'Publish GitHub Release' for name, result in steps.items()), steps
          PY

      - name: Download verified final package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.publish_ready_run }}
          name: ArniCode-darwin-${{ matrix.arch }}
          path: artifacts/macos

      - name: Verify source and final file checksums
        run: |
          set -euo pipefail
          sha256sum --check "artifacts/macos/SHA256SUMS-darwin-$VSCODE_ARCH.txt"
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('artifacts/macos/build-manifest-' + os.environ['VSCODE_ARCH'] + '.json'))
          assert manifest['commit'] == os.environ['SOURCE_COMMIT'], manifest
          assert manifest['architecture'] == os.environ['VSCODE_ARCH'], manifest
          PY

      - name: Upload to existing release
        run: |
          set -euo pipefail
          # Release creation/tagging remains explicit; recovery only uploads the
          # unchanged files whose original agent and Apple checks passed above.
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" artifacts/macos/* --clobber
