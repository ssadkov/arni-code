name: Test computer check — Windows and macOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/vs/sessions/skills/computer-check/**'
      - 'scripts/test-computer-check.py'
      - '.github/workflows/test-computer-check.yml'

permissions:
  contents: read

jobs:
  computer-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixture privacy and native read-only inventory
        env:
          ARNI_TEST_NATIVE: '1'
        run: python scripts/test-computer-check.py
