name: Build Arni Code — Windows x64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_installer:
        description: 'Build Windows installer (.exe)'
        required: false
        default: true
        type: boolean
      build_archive:
        description: 'Build portable archive (.zip)'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Publish artifacts to a GitHub Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Empty = date-based tag for manual runs; ignored on tag push'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_INSTALLER: ${{ github.event_name == 'push' || inputs.build_installer }}
      BUILD_ARCHIVE: ${{ github.event_name == 'push' || inputs.build_archive }}
      PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read .nvmrc
        id: nvmrc
        shell: bash
        run: |
          if [ -f .nvmrc ]; then
            echo "node_version=$(cat .nvmrc | tr -d '\n\r')" >> $GITHUB_OUTPUT
          else
            echo "node_version=20" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.node_version }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Inno Setup
        if: env.BUILD_INSTALLER == 'true'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $innoPath = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path $innoPath)) {
            $innoPath = "${env:ProgramFiles}\Inno Setup 6"
          }
          echo "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Inno Setup added to PATH: $innoPath"

      - name: Configure Visual Studio path
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Write-Host "Found Visual Studio at: $vsPath"
          echo "vs2022_install=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_fetch_retries: '4'
          npm_config_fetch_retry_mintimeout: '10000'
          npm_config_fetch_retry_maxtimeout: '60000'
          npm_config_arch: x64
          npm_config_build_from_source: false
          GYP_MSVS_VERSION: '2022'

      - name: Test billing client compatibility
        working-directory: extensions/copilot
        run: npm run test:unit -- src/extension/byok/vscode-node/test/openRouterProvider.spec.ts src/extension/byok/node/test/openAIEndpoint.spec.ts src/extension/prompts/node/panel/test/toolCalling.spec.ts

      - name: Test agent-host image tool model binding
        shell: pwsh
        run: |
          npm run transpile-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\test.bat --run src/vs/workbench/api/test/browser/mainThreadLanguageModelTools.test.ts --run src/vs/platform/agentHost/test/node/byokResponsesTranslation.test.ts --run src/vs/workbench/contrib/chat/test/browser/agentSessions/agentHostByokLmHandler.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-sdk-vision-bridge.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Arni Agent extension
        shell: pwsh
        run: |
          $extensionDir = "extensions\arni-agent"
          if (Test-Path $extensionDir) {
            Push-Location $extensionDir
            npm install
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (Test-Path "esbuild.js") {
              node esbuild.js --production
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            Pop-Location
            Write-Host "Arni Agent extension built successfully."
          } else {
            Write-Warning "Arni Agent extension directory not found."
          }

      - name: Build Yandex Authentication extension
        shell: pwsh
        run: |
          $yandexDir = "extensions\yandex-authentication"
          if (Test-Path $yandexDir) {
            Push-Location $yandexDir
            npm install
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (Test-Path "esbuild.js") {
              node esbuild.js --production
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            Pop-Location
            Write-Host "Yandex Authentication extension built successfully."
          } else {
            Write-Warning "Yandex Authentication extension directory not found."
          }

      - name: Build VK Authentication extension
        shell: pwsh
        run: |
          $vkDir = "extensions\vk-authentication"
          if (Test-Path $vkDir) {
            Push-Location $vkDir
            npm install
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (Test-Path "esbuild.js") {
              node esbuild.js --production
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            Pop-Location
            Write-Host "VK Authentication extension built successfully."
          } else {
            Write-Warning "VK Authentication extension directory not found."
          }

      - name: Build Arni Code (production)
        run: npm run gulp vscode-win32-x64-min
        env:
          npm_config_arch: x64

      - name: Verify bundled billing client
        run: node scripts/verify-billing-package.mjs ../ArniCode-win32-x64/resources/app artifacts/windows/build-manifest-win32-x64.json x64

      - name: Verify native CLI
        shell: pwsh
        run: |
          $output = & "../ArniCode-win32-x64/bin/arni-code.cmd" --user-data-dir "$env:RUNNER_TEMP/billing-cli-profile" --extensions-dir "$env:RUNNER_TEMP/billing-cli-extensions" --version
          if ($LASTEXITCODE -ne 0 -or $output -notcontains $env:GITHUB_SHA -or $output -notcontains 'x64') { throw "Unexpected Windows CLI version/commit/architecture" }
          $output | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Build Windows installer
        if: env.BUILD_INSTALLER == 'true'
        run: npm run gulp vscode-win32-x64-user-setup

      - name: Build portable archive
        if: env.BUILD_ARCHIVE == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts\windows -Force | Out-Null
          $srcDir = "..\ArniCode-win32-x64"
          if (Test-Path $srcDir) {
            # One top-level ArniCode folder, so unpacking anywhere gives a ready-to-run folder.
            $stageDir = "..\zip-stage"
            New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
            Copy-Item -Path $srcDir -Destination "$stageDir\ArniCode" -Recurse
            Write-Host "Compressing $stageDir\ArniCode to artifacts\windows\ArniCode-win32-x64.zip..."
            Compress-Archive -Path "$stageDir\ArniCode" -DestinationPath "artifacts\windows\ArniCode-win32-x64.zip" -CompressionLevel Optimal
            Write-Host "Archive created successfully."
          } else {
            throw "Source directory $srcDir not found for archive!"
          }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts\windows -Force | Out-Null

          if ($env:BUILD_INSTALLER -eq 'true') {
            $installer = ".build\win32-x64\user-setup\ArniCodeSetup.exe"
            if (-not (Test-Path -LiteralPath $installer)) { throw "Expected installer missing: $installer" }
            Copy-Item -LiteralPath $installer -Destination "artifacts\windows\ArniCodeSetup.exe" -Force
          }
          $checksums = Get-ChildItem -LiteralPath artifacts/windows -File | Where-Object { $_.Extension -in @('.exe', '.zip') } | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -LiteralPath artifacts/windows/SHA256SUMS-win32-x64.txt -Encoding utf8
          "Commit: $env:GITHUB_SHA" | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $checksums | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # List artifacts
          Write-Host "`nCollected artifacts in artifacts\windows:"
          Get-ChildItem "artifacts\windows" | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name) ($sizeMB MB)"
          }

      - name: Upload installer
        if: env.BUILD_INSTALLER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ArniCodeSetup-x64
          path: artifacts/windows/*Setup*.exe
          if-no-files-found: error

      - name: Upload portable archive
        if: env.BUILD_ARCHIVE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ArniCode-win32-x64
          path: artifacts/windows/*.zip
          if-no-files-found: error

      - name: Upload all build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArniCode-build-output
          path: artifacts/windows/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_RELEASE_TAG)) {
            $tag = $env:INPUT_RELEASE_TAG.Trim()
          } else {
            $tag = "v$(Get-Date -Format 'yyyy.MM.dd-HHmm')"
          }

          if ($tag -notmatch '^v') {
            $tag = "v$tag"
          }

          $files = @(
            Get-ChildItem -Path "artifacts\windows\*Setup*.exe" -ErrorAction SilentlyContinue
            Get-ChildItem -Path "artifacts\windows\*.zip" -ErrorAction SilentlyContinue
            Get-ChildItem -Path "artifacts\windows\*.json", "artifacts\windows\*.txt" -ErrorAction SilentlyContinue
          ) | Where-Object { $_ -ne $null }

          if (@($files | Where-Object { $_.Extension -in @('.exe', '.zip') }).Count -eq 0) {
            throw "No release assets found in artifacts\windows (expected *Setup*.exe and/or *.zip)."
          }

          Write-Host "Publishing release '$tag' with assets:"
          $files | ForEach-Object { Write-Host "  $($_.Name)" }

          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release '$tag' already exists — uploading/replacing assets."
            gh release upload $tag @($files.FullName) --clobber
          } else {
            Write-Host "Creating release '$tag'."
            gh release create $tag @($files.FullName) --title $tag --target $env:GITHUB_SHA --generate-notes --latest
          }

          Write-Host "Release URL: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
