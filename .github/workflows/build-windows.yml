name: Build Arni Code — Windows x64

on:
  workflow_dispatch:
    inputs:
      build_installer:
        description: 'Build Windows installer (.exe)'
        required: false
        default: 'true'
        type: boolean
      build_archive:
        description: 'Build portable archive (.zip)'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read .nvmrc
        id: nvmrc
        shell: bash
        run: |
          if [ -f .nvmrc ]; then
            echo "node_version=$(cat .nvmrc | tr -d '\n\r')" >> $GITHUB_OUTPUT
          else
            echo "node_version=20" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.node_version }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Inno Setup
        if: ${{ inputs.build_installer == 'true' || inputs.build_installer == true }}
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $innoPath = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path $innoPath)) {
            $innoPath = "${env:ProgramFiles}\Inno Setup 6"
          }
          echo "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Inno Setup added to PATH: $innoPath"

      - name: Configure Visual Studio path
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Write-Host "Found Visual Studio at: $vsPath"
          echo "vs2022_install=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: x64
          npm_config_build_from_source: false
          GYP_MSVS_VERSION: '2022'

      - name: Build Arni Agent extension
        shell: pwsh
        run: |
          $extensionDir = "extensions\arni-agent"
          if (Test-Path $extensionDir) {
            Push-Location $extensionDir
            npm install
            if (Test-Path "esbuild.js") {
              node esbuild.js --production
            }
            Pop-Location
            Write-Host "Arni Agent extension built successfully."
          } else {
            Write-Warning "Arni Agent extension directory not found."
          }

      - name: Build Yandex Authentication extension
        shell: pwsh
        run: |
          $yandexDir = "extensions\yandex-authentication"
          if (Test-Path $yandexDir) {
            Push-Location $yandexDir
            npm install
            if (Test-Path "esbuild.js") {
              node esbuild.js --production
            }
            Pop-Location
            Write-Host "Yandex Authentication extension built successfully."
          } else {
            Write-Warning "Yandex Authentication extension directory not found."
          }

      - name: Build Arni Code (production)
        run: npm run gulp vscode-win32-x64-min
        env:
          npm_config_arch: x64

      - name: Build Windows installer
        if: ${{ inputs.build_installer == 'true' || inputs.build_installer == true }}
        run: npm run gulp vscode-win32-x64-user-setup

      - name: Build portable archive
        if: ${{ inputs.build_archive == 'true' || inputs.build_archive == true }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts\windows -Force | Out-Null
          $srcDir = "..\ArniCode-win32-x64"
          if (Test-Path $srcDir) {
            Write-Host "Compressing $srcDir to artifacts\windows\ArniCode-win32-x64.zip..."
            Compress-Archive -Path "$srcDir\*" -DestinationPath "artifacts\windows\ArniCode-win32-x64.zip" -CompressionLevel Optimal
            Write-Host "Archive created successfully."
          } else {
            Write-Warning "Source directory $srcDir not found for archive!"
          }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts\windows -Force | Out-Null
          
          # Find and collect installer (.exe)
          $installerFiles = Get-ChildItem -Path ".build" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
          foreach ($f in $installerFiles) {
            Copy-Item $f.FullName -Destination "artifacts\windows\" -Force
            Write-Host "Found installer: $($f.FullName)"
          }
          
          # List artifacts
          Write-Host "`nCollected artifacts in artifacts\windows:"
          Get-ChildItem "artifacts\windows" | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name) ($sizeMB MB)"
          }

      - name: Upload installer
        if: ${{ inputs.build_installer == 'true' || inputs.build_installer == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ArniCodeSetup-x64
          path: artifacts/windows/*Setup*.exe
          if-no-files-found: warn

      - name: Upload portable archive
        if: ${{ inputs.build_archive == 'true' || inputs.build_archive == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ArniCode-win32-x64
          path: artifacts/windows/*.zip
          if-no-files-found: warn

      - name: Upload all build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArniCode-build-output
          path: artifacts/windows/
          if-no-files-found: warn
